:root{--bg:#f7f8fa;--tint:#eceff3;--acc:#1c2430;--ink:#161a20;--muted:#5d6673;--line:#e2e6ea;--f:'Plus Jakarta Sans','Segoe UI',Arial,sans-serif}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);scroll-behavior:smooth}
body{font-family:var(--f);color:var(--ink);background:var(--bg);min-height:100vh;line-height:1.5;
  padding-bottom:calc(110px + env(safe-area-inset-bottom,0))}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0));
  background:#ffffffee;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:19px;letter-spacing:-.2px;flex:1}
.back{background:var(--tint);border:0;border-radius:50%;width:38px;height:38px;font-size:18px}
.call{background:var(--acc);color:#fff;font-weight:700;text-decoration:none;

main{max-width:980px;margin:0 auto;padding:0 16px}

.hero{padding:34px 0 8px}

.hero p{margin-top:14px;font-size:17px;color:var(--muted);max-width:42ch}
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:24px 0 8px}
.tier{border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;background:#fff}
.tier b{display:block;font-size:21px;color:var(--acc);font-weight:800}
.tier span{font-size:12px;color:var(--muted)}
.ex{font-size:13.5px;color:var(--muted);margin-bottom:6px}
h2.sec{font-size:22px;font-weight:800;margin:26px 0 14px;letter-spacing:-.2px}
.packs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.packs{grid-template-columns:repeat(4,1fr);gap:16px}}
.tile{border:1px solid var(--line);border-radius:18px;padding:20px 14px 16px;text-align:left;color:var(--ink);

.tile .em{font-size:42px}
.tile h3{font-size:18px;font-weight:800;margin-top:auto}
.tile small{font-size:13px;color:var(--muted)}
.tile .go{margin-top:6px;align-self:flex-start;background:var(--k);color:#fff;
  font-weight:700;font-size:13px;padding:7px 12px;border-radius:999px}

.phead{padding:26px 0 6px}
.phead .em{font-size:44px}
.phead h1{font-size:clamp(28px,8vw,42px);font-weight:800;line-height:1.1;letter-spacing:-.4px}
.phead p{color:var(--muted);margin-top:6px;max-width:42ch}
.prog{margin:18px 0 6px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.step{text-align:center;border-radius:10px;padding:8px 2px;background:var(--tint);color:var(--muted);font-size:12px;font-weight:600}
.step b{display:block;font-size:18px}
.step.on{background:var(--acc);color:#fff}
.msg{margin-top:10px;font-size:14.5px;font-weight:700;text-align:center}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:16px}}

.card.in{border:1.5px solid var(--acc)}
